name: Release

# Builds Klue for Windows, macOS and Linux and publishes a GitHub pre-release with the
# packages. Start it either way:
#   - push a tag:  git tag v0.1.0 && git push origin v0.1.0
#   - or Actions → Release → Run workflow (pick dev); the tag is then v<version in Cargo.toml>.
#     GitHub shows that button only once this file is on the default branch.
# If any build fails, the release is left as a draft with that build's log attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release (tag v<version in Cargo.toml>). Off = build only.
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"; fi
          echo "KLUE_VERSION=$v" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev \
            libdbus-1-dev libssl-dev cmake clang pkg-config

      - name: Install cargo-deb
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      # Build every C dependency for the same macOS as the app (Info.plist says 11.0);
      # by default they target the runner's own macOS version.
      - name: Target macOS 11
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      # BoringSSL (wreq's TLS) assembles its x86-64 Windows code with NASM, and its
      # bindings are generated with libclang.
      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Point bindgen at LLVM
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked -p klue-app --target ${{ matrix.target }} 2>&1 | tee build.log

      - name: Package
        run: packaging/package.sh "${{ matrix.name }}" "${{ matrix.target }}" "$KLUE_VERSION" 2>&1 | tee -a build.log

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/Klue-*

      - name: Keep the log of a failed build
        if: failure()
        run: |
          mkdir -p dist
          tail -c 200000 build.log > "dist/build-log-${{ matrix.name }}.txt" || echo "no build log" > "dist/build-log-${{ matrix.name }}.txt"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: log-${{ matrix.name }}
          path: dist/build-log-*.txt

  release:
    needs: build
    if: always() && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; else echo "tag=v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Klue ${{ steps.tag.outputs.tag }}
          body_path: packaging/RELEASE_NOTES.md
          draft: ${{ needs.build.result != 'success' }}
          prerelease: true
          files: dist/*
          fail_on_unmatched_files: false
