[workspace]
resolver = "3"
members = ["crates/klue-core", "crates/klue-app"]
default-members = ["crates/klue-app"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
authors = ["Karim W. Almorsi"]
repository = "https://github.com/karimawi/Klue"

[workspace.dependencies]
klue-core = { path = "crates/klue-core", default-features = false }

chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
