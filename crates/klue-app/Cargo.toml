[package]
name = "klue-app"
description = "Klue: one desktop dashboard for your Egyptian telecom quotas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "klue"
path = "src/main.rs"

[features]
default = ["we-model"]
# Klue's own WE captcha model (embedded, pure Rust).
we-model = ["klue-core/we-model"]
# ddddocr as an extra solver (needs ONNX Runtime and its model file).
ocr = ["klue-core/ocr"]
ocr-dynamic = ["klue-core/ocr-dynamic"]

[dependencies]
klue-core.workspace = true

auto-launch = "0.6"
base64 = "0.22"
chrono.workspace = true
dioxus = { version = "0.7.10", default-features = false, features = ["desktop", "launch", "lib", "logger"] }
notify-rust = "4.19"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# `cargo deb -p klue-app` (Linux release packages).
[package.metadata.deb]
name = "klue"
section = "net"
priority = "optional"
extended-description = "Quota, package and renewal info for your WE and Vodafone Egypt lines in one window, with low-quota and renewal notifications."
depends = "$auto, libwebkit2gtk-4.1-0, libayatana-appindicator3-1"
assets = [
    ["target/release/klue", "usr/bin/", "755"],
    ["../../packaging/linux/klue.desktop", "usr/share/applications/", "644"],
    ["icons/klue-256.png", "usr/share/icons/hicolor/256x256/apps/klue.png", "644"],
]
