[package]
name = "klue-app"
description = "Klue: one desktop dashboard for your Egyptian telecom quotas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "klue"
path = "src/main.rs"

[features]
default = ["we-model"]
# Klue's own WE captcha model (embedded, pure Rust).
we-model = ["klue-core/we-model"]
# ddddocr as an extra solver (needs ONNX Runtime and its model file).
ocr = ["klue-core/ocr"]
ocr-dynamic = ["klue-core/ocr-dynamic"]

[dependencies]
klue-core.workspace = true

auto-launch = "0.6"
chrono.workspace = true
# Native UI: iced with its CPU renderer (no webview, no GPU stack).
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "svg", "image-without-codecs", "tokio", "advanced", "x11", "wayland", "crisp"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
interprocess = { version = "2.4", features = ["tokio"] }
notify-rust = "4.19"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Linux uses the StatusNotifierItem D-Bus backend: no GTK or appindicator libraries.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_Media_Audio"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# `cargo deb -p klue-app` (Linux release packages).
[package.metadata.deb]
name = "klue"
section = "net"
priority = "optional"
extended-description = "Quota, package and renewal info for your WE and Vodafone Egypt lines in one window, with low-quota and renewal notifications."
# winit and softbuffer load the X11, xkbcommon and Wayland libraries at run time, so
# cargo-deb can't see them.
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libx11-6, libx11-xcb1, libxcursor1, libxrandr2, libxi6, libxcb1"
assets = [
    ["target/release/klue", "usr/bin/", "755"],
    ["../../packaging/linux/klue.desktop", "usr/share/applications/", "644"],
    ["icons/klue-256.png", "usr/share/icons/hicolor/256x256/apps/klue.png", "644"],
]
